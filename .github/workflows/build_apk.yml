name: Build SmartPark Pro APK

on:
  push:
    paths:
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write SmartPark Pro Source Files
        run: |
          mkdir -p lib/core lib/features/auth lib/features/parking

          cat << 'END_PUBSPEC' > pubspec.yaml
          name: smart_park_pro
          description: SmartPark Enterprise AI Parking & Token Management System
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            flutter_riverpod: ^2.6.1
            google_fonts: ^6.2.1
            dio: ^5.7.0
            flutter_secure_storage: ^10.0.0
            local_auth: ^3.0.2
            google_mlkit_text_recognition: ^0.17.1
            image_picker: ^1.1.2
            mobile_scanner: ^6.0.2
            barcode_widget: ^2.0.4
            pdf: ^3.11.1
            printing: ^5.13.3
            intl: any

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
