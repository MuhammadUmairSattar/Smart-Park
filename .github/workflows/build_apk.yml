                  t = t.replace('minSdk = 23', 'minSdk = 24').replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
                  t = t.replace('minSdkVersion 23', 'minSdkVersion 24').replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
