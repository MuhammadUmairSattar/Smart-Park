name: SmartPark CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Prepare App Icon & Generate Launcher Icons
        run: |
          python3 - << 'EOF'
          import glob, subprocess, sys
          imgs = [f for f in glob.glob('assets/*') if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp'))]
          if imgs:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
              from PIL import Image
              im = Image.open(imgs[0]).convert('RGBA')
              size = max(im.size[0], im.size[1], 1024)
              bg = Image.new('RGBA', (size, size), (255, 255, 255, 255))
              im.thumbnail((int(size * 0.94), int(size * 0.94)), Image.Resampling.LANCZOS)
              bg.paste(im, ((size - im.width) // 2, (size - im.height) // 2), im)
              bg.save('assets/icon.png')
          EOF
          if [ -f assets/icon.png ]; then dart run flutter_launcher_icons; fi

      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build Android APK
        env:
          ORG_GRADLE_PROJECT_ciUnsigned: "true"
        run: |
          flutter build apk --release \
            --dart-define="API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.smartpark-enterprise.com/v1' }}" \
            --dart-define="QR_HMAC_SECRET=${{ secrets.QR_HMAC_SECRET || 'CI_BUILD_SECRET_CHANGE_IN_PROD' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartPark-APK
          path: build/app/outputs/flutter-apk/app-release.apk
