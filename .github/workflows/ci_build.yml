name: SmartPark CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build Android APK
        env:
          ORG_GRADLE_PROJECT_ciUnsigned: "true"
        run: |
          flutter build apk --release \
            --dart-define="API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.smartpark-enterprise.com/v1' }}" \
            --dart-define="QR_HMAC_SECRET=${{ secrets.QR_HMAC_SECRET || 'CI_BUILD_SECRET_CHANGE_IN_PROD' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartPark-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
