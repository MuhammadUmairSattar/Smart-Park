name: Build SmartPark Pro v2 APK

on:
  push:
    paths:
      - 'build_app.sh'
      - '.github/workflows/apk_v2.yml'
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Fix MLKit R8 Proguard & Android Lint
        run: |
          printf '%s\n' '-dontwarn com.google.mlkit.**' '-keep class com.google.mlkit.** { *; }' > android/app/proguard-rules.pro
          if [ -f android/app/build.gradle.kts ] && ! grep -q "proguard-rules.pro" android/app/build.gradle.kts; then
            sed -i 's/release {/release {\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle.kts ] && ! grep -q "checkReleaseBuilds" android/app/build.gradle.kts; then
            sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ] && ! grep -q "proguard-rules.pro" android/app/build.gradle; then
            sed -i 's/release {/release {\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle ] && ! grep -q "checkReleaseBuilds" android/app/build.gradle; then
            sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
          fi
      - run: sed -i 's/name: Smart Park$/name: smart_park_pro/' build_app.sh || true
      - run: bash build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SmartPark-Pro-v2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
