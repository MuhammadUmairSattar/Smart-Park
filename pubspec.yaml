name: SmartPark
description: Production SmartPark Parking, ANPR & SaaS Management Suite.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.5+1
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  local_auth: ^3.0.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.3
  barcode_widget: ^2.0.4
  pdf: ^3.11.1
  printing: ^5.13.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
