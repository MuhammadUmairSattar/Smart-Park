name: Smart Park
description: SmartPark Parking & Token Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^3.0.2
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  barcode_widget: ^2.0.4
  pdf: ^3.11.1
  printing: ^5.13.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
